name: Analytics + Dashboard
on:
  schedule:
    - cron: "0 8 * * *"    # 1:00 PM PKT — pichli posts ki insights mature ho chuki hoti hain
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install anthropic requests
      - name: Fetch insights + advise + build dashboard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
        run: |
          python analytics.py
          python advisor.py
          python build_dashboard.py
      - name: Commit dashboard
        run: |
          git config user.name "autopilot" && git config user.email "bot@users.noreply.github.com"
          git add analytics.json advice.json docs/ && git commit -m "dashboard: $(date -u +%F)" || echo "no changes"
          git push
