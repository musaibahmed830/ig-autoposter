name: Daily IG Post + Reel
on:
  schedule:
    - cron: "0 13 * * *"   # 6:00 PM PKT
  workflow_dispatch:
    inputs:
      topic:
        description: "Manual topic (khaali chhodo auto-rotation ke liye)"
        required: false
        type: string
      category:
        description: "Manual post category (sirf topic diya ho tab matter karta hai)"
        required: false
        type: choice
        default: "Default (brand niche)"
        options:
          - "Default (brand niche)"
          - "Technology"
          - "Business"
          - "Event"
          - "Vlog / Behind-the-scenes"
          - "Travel"
          - "Lifestyle"
          - "Food"
          - "Fashion"
          - "Beauty"
          - "Fitness & Health"
          - "Education"
          - "Entertainment"
          - "Comedy"
          - "Sports"
          - "Music"
          - "Gaming"
          - "News & Current Affairs"
          - "Real Estate"
          - "Automotive"
          - "Finance"
          - "Parenting"
          - "Photography"
          - "Art & Design"
          - "DIY & Crafts"
          - "Motivation"
          - "Pets & Animals"
          - "Nature"
          - "Charity / Nonprofit"
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install google-genai requests pillow
      - name: Run pipeline
        env:
          MANUAL_TOPIC: ${{ github.event.inputs.topic }}
          MANUAL_CATEGORY: ${{ github.event.inputs.category }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CLOUDINARY_CLOUD: ${{ secrets.CLOUDINARY_CLOUD }}
          CLOUDINARY_KEY: ${{ secrets.CLOUDINARY_KEY }}
          CLOUDINARY_SECRET: ${{ secrets.CLOUDINARY_SECRET }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          NICHE: ${{ vars.NICHE }}
          CITY: ${{ vars.CITY }}
          LANGUAGE: ${{ vars.LANGUAGE }}
        run: python run_daily.py
      - name: Commit history
        run: |
          git config user.name "autopilot" && git config user.email "bot@users.noreply.github.com"
          git add history.json && git commit -m "history: $(date -u +%F)" || echo "no changes"
          git push
